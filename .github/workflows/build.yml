name: Build Android App (CI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем код из репозитория
    - uses: actions/checkout@v4

    # 2. Настраиваем Java 17 (обязательно для Android Gradle Plugin 8.x)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Даем права на запуск скрипта сборки
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Собираем Debug APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 5. ЗАГРУЖАЕМ APK В АРТЕФАКТЫ (чтобы можно было скачать)
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
